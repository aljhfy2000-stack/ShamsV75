name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        shell: bash
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Extract project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q Shams_Location_Test_NATIVE.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find project -maxdepth 3 -name settings.gradle -print -quit)")"
          echo "Building: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shams-Location-Test-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
